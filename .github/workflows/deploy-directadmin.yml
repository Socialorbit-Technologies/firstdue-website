# Uploads this repo to https://firstduefiretruckparty.com/staging/ on the DirectAdmin host.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER      104.152.168.40 (server IP; ftp.firstduefiretruckparty.com has no DNS record)
#   FTP_USERNAME    the DirectAdmin FTP user
#   FTP_PASSWORD    that user's password
#   FTP_SERVER_DIR  (optional) folder on the server, ending in /
#                   default: domains/firstduefiretruckparty.com/public_html/staging/
#   FTP_PROTOCOL    (optional) ftps (default) or ftp

name: Deploy staging to DirectAdmin

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: directadmin-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Skip until FTP secrets are added
        if: env.HAS_FTP != 'true'
        run: echo "FTP secrets not set yet - nothing deployed. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD."

      - name: Check out
        if: env.HAS_FTP == 'true'
        uses: actions/checkout@v4

      - name: Upload to /staging over FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose  # allow the host's certificate when connecting by IP
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'domains/firstduefiretruckparty.com/public_html/staging/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .nojekyll
