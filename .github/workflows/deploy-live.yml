# Deploys this branch (the production build) to https://firstduefiretruckparty.com/
# Runs on every push to the `live` branch, or manually.
# Safe by design: nothing on the server is deleted. WordPress files and the database stay
# in place; the old WordPress .htaccess is backed up once as public_html/.htaccess.wp-backup-<date>.
# Rollback: restore that file as public_html/.htaccess.
# Secrets used (shared with staging): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, optional FTP_PROTOCOL.
# Optional secret FTP_LIVE_DIR (default: public_html/).

name: Deploy LIVE site

on:
  push:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: directadmin-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      LIVE_DIR: ${{ secrets.FTP_LIVE_DIR || 'public_html/' }}
    steps:
      - uses: actions/checkout@v4

      - name: Back up the WordPress .htaccess (first deploy only)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          L="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$L; cls -1a $LIVE_DIR; bye" "ftp://$FTP_SERVER" | tr -d '\r' > "$RUNNER_TEMP/listing.txt"
          echo "Files in $LIVE_DIR:"; sed 's#.*/##' "$RUNNER_TEMP/listing.txt" | sort | head -60
          if grep -q 'listing.txt' "$RUNNER_TEMP/listing.txt"; then
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$L; rm -f ${LIVE_DIR}listing.txt; bye" "ftp://$FTP_SERVER" && echo "Removed stray listing.txt"
          fi
          if grep -q 'htaccess.wp-backup' "$RUNNER_TEMP/listing.txt"; then
            echo "Backup already exists - skipping."
          elif grep -qE '(^|/)\.htaccess$' "$RUNNER_TEMP/listing.txt"; then
            B=".htaccess.wp-backup-$(date +%Y%m%d)"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$L; get $LIVE_DIR.htaccess -o $RUNNER_TEMP/wp-htaccess; put $RUNNER_TEMP/wp-htaccess -o $LIVE_DIR$B; bye" "ftp://$FTP_SERVER"
            echo "Backed up WordPress .htaccess to $LIVE_DIR$B"
          else
            echo "No existing .htaccess found."
          fi

      - name: Keep a copy of the backup in the run
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-htaccess-backup
          path: ${{ runner.temp }}/wp-htaccess
          if-no-files-found: ignore

      - name: Upload the static site (no deletions)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          server-dir: ${{ secrets.FTP_LIVE_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
