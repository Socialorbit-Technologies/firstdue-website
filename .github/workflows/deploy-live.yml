# Deploys this branch (the production build) to https://firstduefiretruckparty.com/
# Runs on every push to the `live` branch, or manually.
# Upload only: files on the server that aren't part of this site (e.g. /staging) are never deleted.
# Secrets used (shared with staging): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, optional FTP_PROTOCOL.
# Optional secret FTP_LIVE_DIR (default: public_html/).

name: Deploy LIVE site

on:
  push:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: directadmin-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      LIVE_DIR: ${{ secrets.FTP_LIVE_DIR || 'public_html/' }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove leftover helper files from the server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          L="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set cmd:fail-exit no"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "$L; rm -f ${LIVE_DIR}listing.txt; mrm -f ${LIVE_DIR}.htaccess.wp-backup-*; bye" "ftp://$FTP_SERVER" || true

      - name: Upload the static site (no deletions)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          server-dir: ${{ secrets.FTP_LIVE_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
